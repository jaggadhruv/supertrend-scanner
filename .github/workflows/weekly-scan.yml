name: Weekly Supertrend Scan

"on":
  schedule:
    # 06:00 UTC every Saturday — after Friday's close on most markets.
    - cron: '0 6 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly scan
        run: python scanner.py

      - name: Commit and push results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated weekly scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Retry loop handles races with the daily/combined workflows.
          attempts=0
          max_attempts=5
          until git push; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "Push failed after $attempts attempts; giving up."
              exit 1
            fi
            echo "Push rejected (attempt $attempts/$max_attempts) — pulling with rebase and retrying..."
            git pull --rebase --autostash -X theirs origin main || {
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            }
            sleep $((RANDOM % 5 + 2))
          done
          echo "Pushed successfully after $((attempts + 1)) attempt(s)."
