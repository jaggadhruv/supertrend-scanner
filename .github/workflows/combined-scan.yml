name: Combined Supertrend Scan (Weekly + Daily)

# Runs both the weekly and daily Supertrend scans in one job, commits a
# single merged HTML report to output/combined/, and (because
# COMBINED_PUBLISH_PAGE=1 is set below) publishes a public-view copy to
# docs/ so GitHub Pages serves it as a live URL.
#
# Each run also prunes report files older than 30 days from every output
# folder (output/weekly, output/daily, output/combined, docs/reports).
# See README for the one-time Pages setup.

on:
  schedule:
    # Weekdays at 22:00 UTC — after the US market close.
    - cron: '0 22 * * 1-5'
    # Saturday 07:00 UTC — the weekly candle has just closed.
    - cron: '0 7 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  combined-scan:
    runs-on: ubuntu-latest
    env:
      # Turns on the docs/ publisher inside combined_scanner.py.
      # Set to any non-empty value to enable; unset to disable.
      COMBINED_PUBLISH_PAGE: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run combined scan
        run: python combined_scanner.py

      - name: Commit report, history, flip log, and published page
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/combined output/weekly output/daily \
                  data/weekly_history.json data/daily_history.json data/flip_log.json \
                  docs docs/.nojekyll

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Combined Supertrend report $(date -u +%Y-%m-%d)"

          # Retry loop: the weekly-scan and daily-scan workflows also push
          # to main and can occasionally win a race against this one. On
          # rejection ("fetch first"), pull with rebase and retry. Data
          # files are all deterministic per-run rewrites; a rebase-onto
          # of these committed changes onto the newer tip is safe.
          attempts=0
          max_attempts=5
          until git push; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "Push failed after $attempts attempts; giving up."
              exit 1
            fi
            echo "Push rejected (attempt $attempts/$max_attempts) — pulling with rebase and retrying..."
            # --autostash covers any local artefacts a Pages build step
            # might have left in the working tree; -X theirs prefers our
            # freshly-computed data files on rebase conflicts.
            git pull --rebase --autostash -X theirs origin main || {
              echo "Rebase failed; aborting."
              git rebase --abort || true
              exit 1
            }
            # Small jitter so parallel workflows don't lockstep-retry.
            sleep $((RANDOM % 5 + 2))
          done
          echo "Pushed successfully after $((attempts + 1)) attempt(s)."
