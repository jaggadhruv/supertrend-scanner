name: Combined Supertrend Scan (Weekly + Daily)

# Runs both the weekly and daily Supertrend scans in one job and commits
# a single merged HTML report to output/combined/. Fully independent of
# the weekly-only and daily-only workflows - you can keep all three
# running, or drop the individual ones if the combined view is all you
# need.
#
# The default schedule below fires once every trading day after the US
# close, and once on Saturday morning so the just-closed weekly candle
# is also captured. Adjust the crons (UTC!) to whatever suits you.

on:
  schedule:
    # Weekdays at 22:00 UTC — after US market close (16:00 ET / 17:00 ET DST).
    - cron: '0 22 * * 1-5'
    # Saturday 07:00 UTC — after the previous week's candle has fully closed.
    - cron: '0 7 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  combined-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run combined scan
        run: python combined_scanner.py

      - name: Commit combined report + updated history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/combined data/weekly_history.json data/daily_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Combined Supertrend report $(date -u +%Y-%m-%d)"
            git push
          fi
