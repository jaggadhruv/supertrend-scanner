name: Daily Supertrend Scan

"on":
  schedule:
    # 18:00 UTC, Monday-Friday - after most markets close.
    # Cron is UTC and fields are: minute hour day-of-month month day-of-week.
    # Adjust the hour to suit your market's close + your own timezone.
    - cron: '0 18 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab, any time

permissions:
  contents: write   # needed so the job can commit the new report back to the repo

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        run: python daily_scanner.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
